# Gorbagana RPC deployment spec - GitOps managed
# This file is the source of truth for deployment configuration
# Edit and commit to update the deployment
stack: stack_orchestrator/data/stacks/gorchain-rpc
deploy-to: k8s-kind
namespace: laconic-rpc
network:
  http-proxy:
    - host-name: rpc.gorbagana.wtf
      routes:
        - path: /
          proxy-to: agave-rpc:8899
        - path: /
          proxy-to: agave-rpc:8900
          websocket: true
    - host-name: backpack.gorbagana.wtf
      routes:
        - path: /
          proxy-to: agave-rpc:8899
        - path: /
          proxy-to: agave-rpc:8900
          websocket: true
  acme-email: admin@gorbagana.wtf
  ports:
    agave-rpc:
      - '8899'
      - '8900'
      - '8001'
      - 8001/udp
      - 9000/udp
      - 9001/udp
      - 9002/udp
      - 9003/udp
      - 9004/udp
      - 9005/udp
      - 9006/udp
      - 9007/udp
      - 9008/udp
      - 9009/udp
      - 9010/udp
      - 9011/udp
      - 9012/udp
      - 9013/udp
      - 9014/udp
      - 9015/udp
      - 9016/udp
      - 9017/udp
      - 9018/udp
      - 9019/udp
      - 9020/udp
      - 9021/udp
      - 9022/udp
      - 9023/udp
      - 9024/udp
      - 9025/udp
security:
  privileged: true
  unlimited-memlock: true
  capabilities:
    - IPC_LOCK
# kind-mount-root is kept so dumpster + trashscan stacks can bind-mount
# their DB/redis volumes under /srv/kind (ZFS dataset). RPC's own
# volumes stay off /srv/kind because agave's io_uring snapshot unpack
# produces short writes on ZFS that stall bank load.
kind-mount-root: /srv/kind
volumes:
  # Under deployment dir (ext4), not /srv/kind. io_uring on ext4 is fine.
  rpc-config: ./data/rpc-config
  rpc-ledger: ./data/rpc-ledger
  rpc-accounts: ./data/rpc-accounts
# Metrics-push credentials (INFLUXDB_WRITE_USER, INFLUXDB_WRITE_PASSWORD).
credentials-files:
  - ~/.credentials/gorchain-monitoring.env
config:
  VALIDATOR_ENTRYPOINT: gorbagana.vaasl.io:8001
  # Validator identity (NOT the local rpc-follower identity). The
  # value WWqjqgLBUYoJH9oUaoQHo1BfoVEifeZrWeoPEwdp969 that lived
  # here previously is gorbagana.vaasl.io's local rpc-follower
  # identity — what `getIdentity` against the public 443 endpoint
  # returns, since that endpoint is the rpc, not the validator.
  # Combined with --only-known-rpc this caused the bootstrap to
  # reject the actual validator gossip peer and report "Unable to
  # find any RPC peers." See gorbagana/gor-006.
  KNOWN_VALIDATOR: EkDhrb9ndZ2YtwPZoGipeDoJx9jsNzasHvXsRHJX2t2Y
  RUST_LOG: info
  RPC_PORT: '8899'
  GOSSIP_PORT: '8001'
  DYNAMIC_PORT_RANGE: 9000-9025
  SNAPSHOT_INTERVAL_SLOTS: '200'
  MAXIMUM_SNAPSHOTS_TO_RETAIN: '2'
  # An empty value here makes start-rpc.sh add --private-rpc instead
  # of --public-rpc-address. agave registers the resulting node in
  # gossip CRDS as a spy (no advertised TPU/TVU/repair/serve_repair
  # ports) which prevents the bootstrap from progressing past
  # genesis download — the spy never reaches the snapshot-fetch
  # phase. Set to a non-empty value so the start script takes the
  # public branch. The string is published into CRDS as host:port
  # for other nodes to fetch from; rpc.gorbagana.wtf:443 is the
  # canonical public endpoint, fronted by Caddy on woodburn.
  # See gorbagana/gor-006.
  PUBLIC_RPC_ADDRESS: rpc.gorbagana.wtf:443
  # Empty INFLUXDB_HOST disables metrics push.
  INFLUXDB_HOST: 'https://influxdb.gorbagana.wtf'
  INFLUXDB_DB: 'agave_metrics'
  FAUCET_ADDRESS: ''
configmaps:
  rpc-scripts-config: ./configmaps/rpc-scripts-config
